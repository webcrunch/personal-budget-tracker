# Lokalt och i produktion (produktion lägger docker-compose.prod.yml ovanpå). Lösenorden kommer
# från .env, som deployen skriver från Vault; lokalt kopierar du .env.example till .env.
# Portarna binds till 127.0.0.1: Docker-portar går förbi brandväggen (ufw), så utan det vore
# databasen och API:t nåbara utifrån. pgAdmin finns i docker-compose.dev.yml, bara lokalt.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budget_api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - CONNECTION_STRING=${CONNECTION_STRING:?CONNECTION_STRING saknas i .env (se .env.example)}
      # Stänger av inloggningen, men bara när ASPNETCORE_ENVIRONMENT=Development
      - DISABLE_AUTH=${DISABLE_AUTH:-false}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11435}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-minicpm-v:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - ai-bridge
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend_react:
    build:
      context: ./frontend/react-app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080/api
        - VITE_BASE_PATH=/
    container_name: budget_frontend_react
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - api
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  db:
    image: postgres:16
    container_name: budget_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budget_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgresql}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD saknas i .env (se .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
    healthcheck:
      # $$: variablerna läses i containern, där POSTGRES_USER och POSTGRES_DB är satta
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

networks:
  app-network:
    driver: bridge
  ai-bridge:
    external: true

volumes:
  db-data:
