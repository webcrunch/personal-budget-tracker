name: Budget Tracker Build and Deploy

on:
  push:
    branches: ["main"] # Bygg och deploy bara vid push till main
  pull_request:
    branches: ["main"] # PR:er kör bara testjobbet

jobs:
  # Bygger backend och frontend utan att publicera något. Deploy sker bara om detta går igenom.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build backend
        run: dotnet build backend/ExpenseApi/ExpenseApi.csproj -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/react-app/package-lock.json

      - name: Build frontend (typecheck + vite)
        working-directory: frontend/react-app
        run: |
          npm ci
          npm run build

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # Bygg och pusha API med cachning
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          cache-from: type=registry,ref=passwordnotsafe/budget-api:latest
          cache-to: type=inline
          tags: |
            passwordnotsafe/budget-api:latest
            passwordnotsafe/budget-api:${{ github.sha }}

      # Bygg och pusha Frontend med cachning (Notera build-args för sub-path)
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/react-app
          push: true
          cache-from: type=registry,ref=passwordnotsafe/budget-frontend:latest
          cache-to: type=inline
          build-args: |
            VITE_API_URL=/api
            VITE_BASE_PATH=/
          tags: |
            passwordnotsafe/budget-frontend:latest
            passwordnotsafe/budget-frontend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy SSH_HOST | SERVER_HOST ;
            kv/data/server-deploy SSH_USERNAME | SERVER_USER ;
            kv/data/server-deploy SERVER_PORT | SERVER_PORT ;
            kv/data/server-deploy SSH_PRIVATE_KEY | SERVER_PRIVATE_KEY ;
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD ;
            kv/data/budget-tracker db_pass | DB_PASS ;
            kv/data/budget-tracker db_user | DB_USER ;
            kv/data/budget-tracker db_name | DB_NAME ;
            kv/data/budget-tracker basic_auth | BASIC_AUTH

      - name: Copy docker-compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "/home/repos/budget-tracker"

      - name: Execute Deploy Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,DB_USER,DB_PASS,DB_NAME,BASIC_AUTH
          script: |
            mkdir -p /home/repos/budget-tracker
            cd /home/repos/budget-tracker

            # Generera .env fil specifikt för Budget Tracker
            echo "ASPNETCORE_ENVIRONMENT=Production" > .env
            echo "DOCKER_USERNAME=${DOCKER_USERNAME}" >> .env
            echo "CONNECTION_STRING=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS}" >> .env
            echo "OLLAMA_URL=http://host.docker.internal:11435" >> .env
            echo "OLLAMA_MODEL=llama3.2" >> .env
            echo "OLLAMA_VISION_MODEL=minicpm-v" >> .env
            echo "POSTGRES_DB=${DB_NAME}" >> .env
            echo "POSTGRES_USER=${DB_USER}" >> .env
            echo "POSTGRES_PASSWORD=${DB_PASS}" >> .env
            # Enkla citattecken: en bcrypt-hash innehåller $, som compose annars tolkar som variabler.
            printf "BUDGET_BASIC_AUTH='%s'\n" "${BASIC_AUTH}" >> .env

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -f
