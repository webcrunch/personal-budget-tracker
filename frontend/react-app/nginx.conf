server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Säkerhetsheaders på alla svar. Sessionen ligger i localStorage, så CSP:n är skyddet mot att
    # ett injicerat skript läser den: bara egna skript, och anrop bara till API:t (samma domän)
    # och n8n-webhookarna för inloggningen. blob: behövs för förhandsvisningen av kvitton.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://jarllindquist.com/n8n/webhook/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Inte camera=(): kvittoformuläret öppnar kameran på mobilen (capture="environment")
    add_header Permissions-Policy "microphone=(), geolocation=(), payment=()" always;

    location / {
        try_files $uri $uri/ /index.html; # Viktigt för React Router (SPA-läge)
    }
}
