# Bara lokalt: pgAdmin för att titta i databasen. Deployen läser aldrig den här filen.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Logga in på http://localhost:5050 med PGADMIN_EMAIL och PGADMIN_PASSWORD från .env.

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: budget_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD saknas i .env (se .env.example)}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  pgadmin-data:
