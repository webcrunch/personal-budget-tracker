services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budget_api
    # Bara localhost: i prod går trafiken via Traefik. Docker går förbi ufw, så en publik port vore öppen mot internet.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - CONNECTION_STRING=${CONNECTION_STRING:?Sätt CONNECTION_STRING i .env (se .env.example)}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11435}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-minicpm-v:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - ai-bridge
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend_react:
    build:
      context: ./frontend/react-app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080/api
        - VITE_BASE_PATH=/
    container_name: budget_frontend_react
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - api
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  db:
    image: postgres:16
    container_name: budget_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budget_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgresql}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sätt POSTGRES_PASSWORD i .env (se .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # Bara för utveckling: startar endast med "docker compose --profile dev up".
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: budget_pgadmin
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin

networks:
  app-network:
    driver: bridge
  ai-bridge:
    external: true

volumes:
  db-data:
  pgadmin-data:
